name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend - audit + typecheck + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated API type drift check
        run: |
          npm run generate:api-types
          git diff --exit-code -- src/generated/api-schema.ts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript typecheck
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: Unit tests (vitest)
        run: npm test -- --run

      - name: Build (vite)
        run: npx vite build

  backend:
    name: Backend - audit + lint + fast pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.lock --disable-pip

      - name: Ruff
        run: python -m ruff check app tests

      - name: Backend smoke test
        run: |
          python -c "
          from app.services.agent_registry import agent_registry
          from app.services.ids_service import validate_ids
          from app.services.mcp_registry import mcp_registry
          print('smoke ok')
          "

      - name: Fast unit tests (no IfcOpenShell file load, no sandbox subprocess)
        run: |
          python -m pytest -q -m "not requires_ifc_load and not subprocess_sandbox" --tb=short

  sidecar:
    name: IFC sidecar - typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/sidecar

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/sidecar/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  desktop:
    name: Desktop - format + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust tests
        run: cargo test --locked

  docs:
    name: Docs - generated-file drift + strict mkdocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-docs.txt

      - name: Install docs deps
        run: |
          pip install --require-hashes -r backend/requirements.lock
          pip install -r requirements-docs.txt

      # The generators import the live tool/route registries; --check fails
      # the build when TOOLS_REFERENCE/REST/WEBSOCKET drifted from the code.
      - name: Generated docs drift check
        run: |
          python scripts/export_openapi_schema.py --check
          python scripts/generate_tools_doc.py --check
          python scripts/generate_api_doc.py --check

      - name: Strict mkdocs build
        run: python -m mkdocs build --strict

  backend-full:
    name: Backend - full pytest suite (Linux, IfcOpenShell safe)
    runs-on: ubuntu-latest
    # Only on pushes to main (not on PRs) to save CI minutes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      # The IFC-load tests need the sample model, which is a release asset,
      # not a tracked file. conftest skips those tests when the download is
      # unavailable (e.g. before the first release exists).
      - name: Fetch sample model
        working-directory: .
        continue-on-error: true
        run: bash scripts/fetch-sample.sh

      - name: Full test suite
        run: python -m pytest -q --tb=short
