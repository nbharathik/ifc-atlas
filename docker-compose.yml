services:
  backend:
    # Note: the backend image has no Node.js, so the optional Node sidecar
    # (server-side IFC -> fragments conversion) does not run in Docker.
    # Model loads use the in-browser web-ifc worker parse instead, which is
    # slower on large models but fully functional.
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:ro
      # All writable state (uploads, fragment cache, secrets, edit history)
      # lives in the per-user dotfolder - persist it across recreates.
      - ifc-atlas-data:/home/ifcatlas/.ifc-atlas
    environment:
      - FRONTEND_URL=http://localhost:5173
      - HOST=0.0.0.0
      - IFC_ATLAS_SECURITY_MODE=server
      - IFC_ATLAS_API_TOKEN=${IFC_ATLAS_API_TOKEN:?Set a random token with at least 32 characters}
    env_file:
      # Optional: API keys / overrides. You can also set keys in-app
      # (stored in the ifc-atlas-data volume).
      - path: ./backend/.env
        required: false
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      # Vite's /api dev proxy must target the backend container, not the
      # frontend container's own localhost.
      - BACKEND_HOST=backend
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ifc-atlas-data:
