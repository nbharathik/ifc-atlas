[pytest]
# Markers used to split fast vs full backend test runs.
#
# `requires_ifc_load` - test fixture loads BasicHouse.ifc (or another real
# IFC) through IfcOpenShell. On Windows + Python 3.13 this combination
# segfaults during pytest collection. Always-passing on Linux CI.
#
# `subprocess_sandbox` - test spawns a subprocess Python interpreter to
# exercise the execute_ifc_code sandbox runner. Slow and Windows-flaky.
#
# Fast pre-flight (CI-friendly, <60 s, no IFC load):
#   pytest -m "not requires_ifc_load and not subprocess_sandbox"
#
# Full suite (Linux/macOS, or Windows on Python 3.12 - Windows + Python 3.13
# hits SIGSEGV in ifcopenshell):
#   pytest
markers =
    requires_ifc_load: test fixture loads a real IFC via IfcOpenShell (slow + Windows/Py3.13 SIGSEGV-prone)
    subprocess_sandbox: test spawns a subprocess for the execute_ifc_code sandbox runner (slow, Windows-flaky)

# Short tracebacks keep failure noise low; -q is added by callers when wanted.
addopts = -ra
testpaths = tests
