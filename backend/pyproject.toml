[project]
name = "ifc-atlas-backend"
version = "1.2.0"
description = "FastAPI backend for IFC Atlas - LLM chat, tool routing, IfcOpenShell helpers, MCP server."
license = { text = "MPL-2.0" }
# IfcOpenShell 0.8.x segfaults under pytest collection on Windows + Python 3.13.
# Cap at <3.13 so contributors don't hit it accidentally. Linux 3.13 works but
# full CI runs on 3.12 anyway.
requires-python = ">=3.11,<3.13"

[project.scripts]
ifc-atlas = "app.cli:main"

[tool.pytest.ini_options]
# Mirror of pytest.ini for tooling that reads pyproject only. Keep both in sync.
markers = [
    "requires_ifc_load: test fixture loads a real IFC via IfcOpenShell (slow + Windows/Py3.13 SIGSEGV-prone)",
    "subprocess_sandbox: test spawns a subprocess for the execute_ifc_code sandbox runner (slow, Windows-flaky)",
]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
# Match the declared support floor (requires-python = ">=3.11"). This catches
# 3.11-incompatible syntax (e.g. PEP 701 nested-quote f-strings) before it ships.
target-version = "py311"

[tool.ruff.lint]
# Pyflakes rules only for now: unused imports/variables + undefined names. Keeps a
# clean baseline without imposing a broad style overhaul on the existing codebase.
select = ["F"]
