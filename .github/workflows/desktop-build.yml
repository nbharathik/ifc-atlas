# Builds the standalone desktop installers (Tauri shell + PyInstaller-frozen
# backend sidecar) on every OS in the matrix. Neither Tauri nor PyInstaller can
# cross-compile, so each platform's bundle must be built on that platform.
#
# Triggers: manual (workflow_dispatch) or a version tag push (v*).
# Artifacts: installer bundles per OS, downloadable from the run's Artifacts.
# On a tag push the installers are also attached to the GitHub Release under
# stable, version-independent names, so the website and docs can link to
# .../releases/latest/download/<name> permanently.
name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # NSIS .exe + .msi
          - os: ubuntu-22.04     # .AppImage + .deb + .rpm (build on the oldest
                                 # supported distro for glibc compatibility)
          # macOS is deliberately not enabled yet: unsigned .app bundles are
          # blocked by Gatekeeper, so shipping mac builds first needs an Apple
          # Developer cert + notarization step. Uncomment when that exists.
          # - os: macos-latest   # .dmg (Apple Silicon)
          # - os: macos-13       # .dmg (Intel)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xvfb dbus

      - name: Install backend dependencies + PyInstaller
        run: |
          pip install -r backend/requirements.txt pyinstaller

      - name: Freeze backend sidecar (Windows)
        if: runner.os == 'Windows'
        run: powershell -File scripts/build_sidecar.ps1

      - name: Freeze backend sidecar (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/build_sidecar.sh
        env:
          PYTHON: python

      - name: Install JS dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      # bundle.createUpdaterArtifacts is on by default (signed auto-updates).
      # Builds without the signing-key secret (e.g. a fork's workflow_dispatch
      # smoke build) would otherwise fail, so flip it off for keyless runs.
      - name: Disable updater artifacts when unsigned (no signing-key secret)
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "No TAURI_SIGNING_PRIVATE_KEY secret - building without updater artifacts"
            node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(j,null,2))"
          fi

      - name: Build Tauri bundles
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg

      # Launch smoke test: run the ACTUAL AppImage users download (bundle
      # layout, sidecar inclusion, linuxdeploy patching all exercised) under a
      # virtual display and assert the backend sidecar announces readiness.
      # Runs after the artifact upload on purpose: a failed smoke still leaves
      # the installers downloadable for local debugging, while (on tag runs)
      # still blocking the release-asset staging/attach steps below.
      #
      # The two WEBKIT_DISABLE_* vars force WebKitGTK's software path. CI
      # runners have no GPU, so this is exactly the environment those
      # workarounds target - but it means the smoke does NOT reproduce how end
      # users run the app (they get the GPU path unless safe graphics mode is
      # on; see docs/architecture/TAURI.md "Linux graphics troubleshooting").
      # --appimage-extract-and-run avoids the FUSE mount CI runners lack.
      - name: Smoke test the built app (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          set -euo pipefail
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          echo "Smoke testing: $APPIMAGE"
          chmod +x "$APPIMAGE"
          # Headless-session plumbing the runner lacks: a session DBus (the
          # single-instance plugin and WebKitGTK both talk to it on Linux)
          # and a private XDG_RUNTIME_DIR.
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          : > smoke.log
          xvfb-run --auto-servernum dbus-run-session -- \
            "$APPIMAGE" --appimage-extract-and-run > smoke.log 2>&1 &
          SMOKE_PID=$!
          READY=0
          for i in $(seq 1 90); do
            if grep -q "BACKEND_READY port=" smoke.log; then
              READY=1
              echo "Backend announced ready after ~${i}s"
              break
            fi
            if ! kill -0 "$SMOKE_PID" 2>/dev/null; then
              echo "App process exited before the backend became ready"
              break
            fi
            sleep 1
          done
          # Tear the whole tree down (shell + PyInstaller bootloader + Python
          # child); pkill -f matches the extracted binary and sidecar names.
          pkill -TERM -f 'ifc-atlas' 2>/dev/null || true
          pkill -TERM -f 'ifc-backend' 2>/dev/null || true
          sleep 3
          pkill -KILL -f 'ifc-backend' 2>/dev/null || true
          kill -KILL "$SMOKE_PID" 2>/dev/null || true
          if [ "$READY" != "1" ]; then
            echo "::error::Linux smoke test failed - no 'BACKEND_READY port=' within 90s"
            echo "----- captured app output (smoke.log) -----"
            cat smoke.log
            exit 1
          fi
          echo "Smoke test passed."

      # Tauri's bundle filenames embed the version and (on Windows) spaces,
      # so copy them to stable names the website/docs can deep-link forever
      # via .../releases/latest/download/<name>.
      - name: Stage release assets (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")[0] "release-assets/IFC-Atlas-Setup-x64.exe"
          Copy-Item (Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi")[0] "release-assets/IFC-Atlas-x64.msi"
          # Updater signature (present only on signed builds). The updater
          # feeds on the NSIS exe, so its .sig rides along under the stable name.
          $sig = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" -ErrorAction SilentlyContinue
          if ($sig) { Copy-Item $sig[0] "release-assets/IFC-Atlas-Setup-x64.exe.sig" }

      - name: Stage release assets (Linux)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/appimage/*.AppImage "release-assets/IFC-Atlas-x86_64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "release-assets/IFC-Atlas-amd64.deb"
          cp src-tauri/target/release/bundle/rpm/*.rpm "release-assets/IFC-Atlas-x86_64.rpm"
          # Updater signature (AppImage is the only Linux updater channel).
          if ls src-tauri/target/release/bundle/appimage/*.AppImage.sig >/dev/null 2>&1; then
            cp src-tauri/target/release/bundle/appimage/*.AppImage.sig "release-assets/IFC-Atlas-x86_64.AppImage.sig"
          fi

      - name: Upload staged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          if-no-files-found: error
          path: release-assets/*

  # A single attach job (instead of one per matrix leg) so two legs never
  # race to create the same release, which could intermittently drop one
  # OS's installers from the tag.
  release:
    name: Attach installers to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download staged release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      # The updater endpoint in tauri.conf.json points at
      # .../releases/latest/download/latest.json - installed apps poll it.
      # Skipped cleanly for unsigned releases (no .sig files staged).
      - name: Generate updater manifest (latest.json)
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          WIN_SIG="release-assets/IFC-Atlas-Setup-x64.exe.sig"
          LIN_SIG="release-assets/IFC-Atlas-x86_64.AppImage.sig"
          if [ ! -f "$WIN_SIG" ] && [ ! -f "$LIN_SIG" ]; then
            echo "No updater signatures staged - skipping latest.json (unsigned release)"
            exit 0
          fi
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          jq -n \
            --arg version "${TAG#v}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wsig "$(cat "$WIN_SIG" 2>/dev/null || true)" \
            --arg wurl "$BASE/IFC-Atlas-Setup-x64.exe" \
            --arg lsig "$(cat "$LIN_SIG" 2>/dev/null || true)" \
            --arg lurl "$BASE/IFC-Atlas-x86_64.AppImage" \
            '{version: $version, pub_date: $pub_date, platforms:
              ((if $wsig != "" then {"windows-x86_64": {signature: $wsig, url: $wurl}} else {} end)
               + (if $lsig != "" then {"linux-x86_64": {signature: $lsig, url: $lurl}} else {} end))}' \
            > release-assets/latest.json
          cat release-assets/latest.json

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
