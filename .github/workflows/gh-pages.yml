name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy the MkDocs documentation site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Framework docs (mkdocs-material) ──────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps (for doc generators)
        run: pip install -r backend/requirements.txt

      - name: Install mkdocs deps
        run: pip install -r requirements-docs.txt

      - name: Regenerate auto-generated doc pages
        env:
          PYTHONPATH: backend
        run: |
          python scripts/generate_tools_doc.py
          python scripts/generate_api_doc.py

      - name: Build mkdocs site
        run: mkdocs build

      # ── Publish the docs at the site root (served at /ifc-atlas/) ──────
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true
